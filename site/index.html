<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATH 156 final prep</title>
  <meta name="description" content="A 35 day plan for the MATH 156 final: explanations for every unit, quick checks, practice questions with worked solutions, timed exams and a mistake log.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5fbf'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/stix-two-text-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top">
    <p class="course">MATH 156 final <span id="countdown"></span></p>
    <nav aria-label="Sections">
      <a href="#today" data-view="today">Today</a>
      <a href="#plan" data-view="plan">Plan</a>
      <a href="#units" data-view="units">Units</a>
      <a href="#exams" data-view="exams">Exams</a>
      <a href="#progress" data-view="progress">Progress</a>
      <a href="#mistakes" data-view="mistakes">Mistakes <span id="due-badge"></span></a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <details>
      <summary>How this works</summary>
      <dl id="rules"></dl>
    </details>
    <details class="backup">
      <summary>Back up or restore</summary>
      <p>Your progress is saved in this browser only. A backup lets you move it to another device or keep it safe.</p>
      <p class="backup-row">
        <button type="button" class="btn plain tight" id="export">Download a backup</button>
        <button type="button" class="btn plain tight" id="copy">Copy a backup</button>
        <button type="button" class="btn plain tight" id="import">Restore from a file</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </p>
      <label class="field"><span>Or paste a backup here</span><textarea id="paste" rows="3" spellcheck="false"></textarea></label>
      <p class="backup-row"><button type="button" class="btn plain tight" id="paste-go">Restore from pasted text</button></p>
      <p class="backup-row" id="restore-confirm" hidden>
        <button type="button" class="btn tight" id="restore-yes">Replace my progress</button>
        <button type="button" class="btn plain tight" id="restore-no">Cancel</button>
      </p>
    </details>
    <p id="backup-msg" role="status"></p>
  </footer>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="data.js"></script>
  <script src="questions.js"></script>
  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
